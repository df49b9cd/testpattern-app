[package]
name = "testpattern"
version = "0.1.0"
description = "testpattern — an IPTV player"
edition = "2024"
rust-version = "1.99.0"
license = "GPL-3.0-or-later"

[lib]
name = "testpattern_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
flate2 = "1"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
libc = "0.2"
libloading = "0.9"
log = "0.4"
parking_lot = "0.12"
quick-xml = "0.42"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "json", "stream", "http2", "charset"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# macos-private-api: the macOS port needs the private window APIs Tauri
# gates behind this feature (fully transparent window background and the
# non-activating panel behavior of the player overlay). It blocks Mac App
# Store distribution — fine, this app ships outside the store.
tauri = { version = "2.11", features = ["macos-private-api"] }
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
url = "2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2

# The GTK3 binding versions are dictated by webkit2gtk 2.0.2 (newest release),
# which Tauri 2.11 is built on. Newer gtk/glib/cairo/javascriptcore crates
# would be a second, incompatible type universe — bump them only together
# with Tauri.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
cairo-rs = { version = "0.18", features = ["png"] }
javascriptcore-rs = "1.1"
# source passwords in the desktop keyring (Secret Service: KWallet, GNOME Keyring)
secret-service = { version = "5.2", features = ["rt-tokio-crypto-rust"] }

# macOS video surface (player/macos.rs): the NSOpenGLView mpv renders into,
# plus the dispatch block the mpv redraw callback hops onto the main queue with.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "NSView", "NSWindow", "NSOpenGL", "NSOpenGLView", "NSColor",
] }
objc2-quartz-core = "0.3"
objc2-core-video = "0.3"
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }
