# CI (WORKLOG T-037). Every push to main and every pull request runs
# scripts/check.sh — Rust unit tests + clippy, TypeScript typecheck + vitest,
# third-party notices — on Ubuntu 24.04 with the packages the release
# container uses (packaging/ubuntu/packages.txt). Version tags (v*), pushes to
# main and manual runs also build the portable release bundles (T-049); tag
# builds additionally publish them on a GitHub release. The end-to-end smoke
# test stays local: it needs the IPTV account, which allows one stream at a time.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(sed -e 's/#.*//' packaging/ubuntu/packages.txt)

      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # FFmpeg/mpv & co. sources and static build, redone only when
      # build-media.sh (tags, options) or the system packages change
      - name: Media engine cache
        uses: actions/cache@v6
        with:
          path: |
            third_party/src
            third_party/prefix
          key: media-ubuntu24.04-${{ hashFiles('scripts/build-media.sh', 'packaging/ubuntu/packages.txt') }}

      - name: Media engine
        run: scripts/build-media.sh

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Checks
        run: scripts/check.sh

  bundle:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(sed -e 's/#.*//' packaging/ubuntu/packages.txt)

      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Media engine cache
        uses: actions/cache@v6
        with:
          path: |
            third_party/src
            third_party/prefix
          key: media-ubuntu24.04-${{ hashFiles('scripts/build-media.sh', 'packaging/ubuntu/packages.txt') }}

      - name: Media engine
        run: scripts/build-media.sh

      # one binary (glibc 2.39) as .deb, AppImage and .rpm — like
      # scripts/ubuntu-build.sh; the AppImage tools run without FUSE
      - name: Bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get install -y --no-install-recommends squashfs-tools
          bun install --frozen-lockfile
          bun run tauri build --bundles deb,appimage,rpm
          scripts/appimage-fix.sh src-tauri/target/release/bundle/appimage/*.AppImage
          objdump -T src-tauri/target/release/testpattern | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1
          scripts/deb-depends.sh src-tauri/target/release/testpattern

      - uses: actions/upload-artifact@v7
        with:
          name: testpattern-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      # version tags publish the bundles on a GitHub release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

  # the same triggers as the bundles, built from packaging/flatpak/ (T-057)
  # in Flathub's GNOME image; the action uploads testpattern.flatpak
  flatpak:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Pins
        run: scripts/flatpak.sh pins

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/dev.testpattern.app.yml
          bundle: testpattern.flatpak
          cache-key: flatpak-${{ hashFiles('packaging/flatpak/dev.testpattern.app.yml', 'scripts/build-media.sh') }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: testpattern.flatpak
